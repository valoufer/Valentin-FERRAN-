<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio de Valentin Ferran — Ingénieur mécanique">
  <title>Valentin Ferran — Mechanical Engineer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f3;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(900px, 90%);
      text-align: center;
      padding: 60px 20px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.05em;
    }
    .subtitle {
      margin: 16px 0 10px;
      font-size: 1.25rem;
      color: #555;
    }
    .intro {
      max-width: 620px;
      margin: 0 auto 42px;
      line-height: 1.6;
      color: #666;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }
    .links a {
      display: inline-block;
      min-width: 190px;
      padding: 16px 24px;
      border: 1px solid #171717;
      color: #171717;
      text-decoration: none;
      font-weight: 600;
      transition: .2s ease;
      background: transparent;
    }
    .links a:hover {
      background: #171717;
      color: white;
      transform: translateY(-2px);
    }
    footer {
      margin-top: 55px;
      font-size: .85rem;
      color: #999;
    }
  </style>
</head>
<body>
  <main>
    <h1>VALENTIN FERRAN</h1>
    <div class="subtitle">Mechanical Engineer</div>
    <p class="intro">
      Mechanical design · Product development · Hydrofoil · 3D printing
    </p>

    <nav class="links" aria-label="Portfolio links">
      <a href="pdf/CV_Valentin_Ferran.pdf" target="_blank">CV</a>
      <a href="pdf/Portfolio_Foil.pdf" target="_blank">Foil Portfolio</a>
      <a href="pdf/Portfolio_3D_Printing.pdf" target="_blank">3D Printing Portfolio</a>
    </nav>

    <footer>
      © 2026 Valentin Ferran
    </footer>
  </main>
</body>
</html>
